<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flyer to ICS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <meta name="theme-color" content="#4f46e5">
  <link rel="manifest" href="data:application/manifest+json,{%22name%22:%22Flyer%20to%20ICS%22,%22short_name%22:%22Flyer2ICS%22,%22start_url%22:%22.%22,%22display%22:%22standalone%22,%22background_color%22:%22%23f3f4f6%22,%22theme_color%22:%22%234f46e5%22}">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-12 flex flex-col items-center">

  <!-- Header -->
  <header class="w-full max-w-xl p-4 flex justify-between items-center border-b border-slate-800">
    <h1 class="text-xl font-bold text-indigo-400">📅 Flyer to ICS</h1>
    <button id="settingsBtn" class="px-3 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded text-sm font-medium border border-slate-700">
      ⚙️ API Key
    </button>
  </header>

  <main class="w-full max-w-xl p-4 space-y-6">

    <!-- API Key Notice -->
    <div id="keyNotice" class="bg-amber-950/50 border border-amber-600/50 text-amber-200 p-3 rounded-lg text-sm flex justify-between items-center">
      <span>🔑 API Key (Google AI Studio) required to scan photos.</span>
      <button onclick="openSettings()" class="underline font-semibold ml-2">Set Key</button>
    </div>

    <!-- Action Bar / Upload Form -->
    <div class="bg-slate-800 border border-slate-700 rounded-xl p-5 space-y-4">
      <h2 class="text-base font-semibold text-slate-200">1. Select an Option</h2>
      
      <div class="grid grid-cols-2 gap-3">
        <!-- Photo Upload Button -->
        <label class="flex flex-col items-center justify-center p-4 bg-indigo-600 hover:bg-indigo-500 rounded-lg cursor-pointer text-center font-medium transition">
          <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h0.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
          <span class="text-sm">Scan Flyer</span>
          <input type="file" id="imageInput" accept="image/*" class="hidden">
        </label>

        <!-- Manual Creation Button -->
        <button id="manualBtn" class="flex flex-col items-center justify-center p-4 bg-slate-700 hover:bg-slate-600 rounded-lg text-center font-medium transition">
          <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
          <span class="text-sm">Create Manually</span>
        </button>
      </div>

      <!-- Preview Image -->
      <div id="imagePreviewContainer" class="hidden">
        <img id="imagePreview" class="w-full max-h-48 object-cover rounded-md border border-slate-700">
      </div>

      <!-- Loading Spinner -->
      <div id="loader" class="hidden flex items-center justify-center space-x-2 py-4">
        <div class="w-5 h-5 border-2 border-indigo-400 border-t-transparent rounded-full animate-spin"></div>
        <span class="text-indigo-300 text-sm">Extracting event details...</span>
      </div>
    </div>

    <!-- Event Form & ICS Generator -->
    <div id="eventCard" class="bg-slate-800 border border-slate-700 rounded-xl p-5 space-y-4 hidden">
      <h2 class="text-base font-semibold text-slate-200">2. Event Details</h2>

      <div class="space-y-3">
        <div>
          <label class="block text-xs text-slate-400 mb-1">Event Title</label>
          <input type="text" id="eventTitle" placeholder="Meeting / Concert / Party" class="w-full bg-slate-900 border border-slate-700 rounded p-2.5 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs text-slate-400 mb-1">Start Time</label>
            <input type="datetime-local" id="eventStart" class="w-full bg-slate-900 border border-slate-700 rounded p-2.5 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
          </div>
          <div>
            <label class="block text-xs text-slate-400 mb-1">End Time</label>
            <input type="datetime-local" id="eventEnd" class="w-full bg-slate-900 border border-slate-700 rounded p-2.5 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
          </div>
        </div>

        <div>
          <label class="block text-xs text-slate-400 mb-1">Location</label>
          <input type="text" id="eventLocation" placeholder="Address or online link" class="w-full bg-slate-900 border border-slate-700 rounded p-2.5 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
        </div>

        <div>
          <label class="block text-xs text-slate-400 mb-1">Description</label>
          <textarea id="eventDescription" rows="3" placeholder="Additional details..." class="w-full bg-slate-900 border border-slate-700 rounded p-2.5 text-sm text-slate-100 focus:outline-none focus:border-indigo-500"></textarea>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="pt-2 space-y-2">
        <button onclick="downloadICS()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 rounded-lg flex items-center justify-center space-x-2 transition">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
          <span>Download .ics File</span>
        </button>

        <button onclick="copyPlainICS()" class="w-full bg-slate-700 hover:bg-slate-600 text-slate-200 font-medium py-2 rounded-lg text-sm transition">
          📋 Copy Raw .ics Text
        </button>
      </div>
    </div>

  </main>

  <!-- Settings Modal -->
  <div id="settingsModal" class="fixed inset-0 bg-black/70 flex items-center justify-center p-4 hidden z-50">
    <div class="bg-slate-800 border border-slate-700 w-full max-w-md rounded-xl p-5 space-y-4">
      <h3 class="text-lg font-bold text-slate-100">API Key Settings</h3>
      <p class="text-xs text-slate-400">Enter your free Google AI Studio API Key to process flyer photos on-device.</p>
      
      <input type="password" id="apiKeyInput" placeholder="AIzaSy..." class="w-full bg-slate-900 border border-slate-700 rounded p-2.5 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">

      <div class="flex justify-end space-x-2 pt-2">
        <button onclick="closeSettings()" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded text-sm">Cancel</button>
        <button onclick="saveApiKey()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded text-sm">Save</button>
      </div>
    </div>
  </div>

  <script>
    // State
    let apiKey = localStorage.getItem('gemini_api_key') || '';

    // Elements
    const keyNotice = document.getElementById('keyNotice');
    const settingsModal = document.getElementById('settingsModal');
    const apiKeyInput = document.getElementById('apiKeyInput');
    const imageInput = document.getElementById('imageInput');
    const manualBtn = document.getElementById('manualBtn');
    const imagePreview = document.getElementById('imagePreview');
    const imagePreviewContainer = document.getElementById('imagePreviewContainer');
    const loader = document.getElementById('loader');
    const eventCard = document.getElementById('eventCard');

    // Init UI
    updateKeyNotice();

    function updateKeyNotice() {
      if (apiKey) {
        keyNotice.classList.add('hidden');
      } else {
        keyNotice.classList.remove('hidden');
      }
    }

    document.getElementById('settingsBtn').onclick = openSettings;

    function openSettings() {
      apiKeyInput.value = apiKey;
      settingsModal.classList.remove('hidden');
    }

    function closeSettings() {
      settingsModal.classList.add('hidden');
    }

    function saveApiKey() {
      apiKey = apiKeyInput.value.trim();
      localStorage.setItem('gemini_api_key', apiKey);
      updateKeyNotice();
      closeSettings();
    }

    // Manual Form Open
    manualBtn.onclick = () => {
      imagePreviewContainer.classList.add('hidden');
      eventCard.classList.remove('hidden');
      // Set default start time to now + 1hr
      const now = new Date();
      now.setHours(now.getHours() + 1, 0, 0, 0);
      const later = new Date(now.getTime() + 60*60*1000);
      
      if (!document.getElementById('eventStart').value) {
        document.getElementById('eventStart').value = now.toISOString().slice(0,16);
        document.getElementById('eventEnd').value = later.toISOString().slice(0,16);
      }
    };

    // Image Upload & AI Processing
    imageInput.onchange = async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      if (!apiKey) {
        alert("Please set your API Key (Google AI Studio) in settings first!");
        openSettings();
        return;
      }

      // Show preview
      const reader = new FileReader();
      reader.onload = async (event) => {
        const base64Data = event.target.result.split(',')[1];
        imagePreview.src = event.target.result;
        imagePreviewContainer.classList.remove('hidden');
        
        // Call Gemini API
        await extractEventDetails(base64Data, file.type);
      };
      reader.readAsDataURL(file);
    };

    async function extractEventDetails(base64Image, mimeType) {
      loader.classList.remove('hidden');
      eventCard.classList.add('hidden');

      const promptText = `Extract the event title, start date/time, end date/time (if mentioned or estimate 1 hour later), location, and description from this flyer.
Return ONLY a raw JSON object with this exact structure:
{
  "title": "Event Name",
  "startISO": "YYYY-MM-DDTHH:MM",
  "endISO": "YYYY-MM-DDTHH:MM",
  "location": "Address or venue name",
  "description": "Details about the event"
}`;

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{
              parts: [
                { text: promptText },
                { inline_data: { mime_type: mimeType, data: base64Image } }
              ]
            }]
          })
        });

        const data = await response.json();
        
        if (data.error) {
          throw new Error(data.error.message || "API Error");
        }

        const rawText = data.candidates[0].content.parts[0].text;
        const jsonMatch = rawText.match(/\{[\s\S]*\}/);
        
        if (!jsonMatch) throw new Error("Could not parse JSON response from AI.");

        const parsed = JSON.parse(jsonMatch[0]);

        document.getElementById('eventTitle').value = parsed.title || '';
        document.getElementById('eventStart').value = parsed.startISO || '';
        document.getElementById('eventEnd').value = parsed.endISO || '';
        document.getElementById('eventLocation').value = parsed.location || '';
        document.getElementById('eventDescription').value = parsed.description || '';

        eventCard.classList.remove('hidden');
      } catch (err) {
        alert("Error analyzing image: " + err.message);
      } finally {
        loader.classList.add('hidden');
      }
    }

    // ICS Generator Helper Functions
    function formatToICSDate(dateTimeString) {
      if (!dateTimeString) return '';
      const d = new Date(dateTimeString);
      return d.toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
    }

    function buildICSContent() {
      const title = document.getElementById('eventTitle').value || 'Event';
      const start = formatToICSDate(document.getElementById('eventStart').value);
      const end = formatToICSDate(document.getElementById('eventEnd').value);
      const location = document.getElementById('eventLocation').value || '';
      const description = document.getElementById('eventDescription').value || '';
      const now = formatToICSDate(new Date().toISOString());

      return [
        'BEGIN:VCALENDAR',
        'VERSION:2.0',
        'PRODID:-//FlyerToICS//EN',
        'CALSCALE:GREGORIAN',
        'METHOD:PUBLISH',
        'BEGIN:VEVENT',
        `UID:evt-${Date.now()}@flyertoics`,
        `DTSTAMP:${now}`,
        `DTSTART:${start}`,
        `DTEND:${end}`,
        `SUMMARY:${title}`,
        `LOCATION:${location}`,
        `DESCRIPTION:${description}`,
        'END:VEVENT',
        'END:VCALENDAR'
      ].join('\r\n');
    }

    function downloadICS() {
      const title = document.getElementById('eventTitle').value || 'event';
      const icsData = buildICSContent();
      const blob = new Blob([icsData], { type: 'text/calendar;charset=utf-8;' });
      
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.setAttribute('download', `${title.replace(/[^a-z0-9]/gi, '_').toLowerCase()}.ics`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    function copyPlainICS() {
      const icsData = buildICSContent();
      navigator.clipboard.writeText(icsData).then(() => {
        alert("Raw .ics content copied to clipboard!");
      }).catch(err => {
        alert("Copy failed: " + err);
      });
    }
  </script>
</body>
</html>
